<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otoyol Sürücüsü — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#eef3f8;font:16px system-ui}main{max-width:950px;margin:auto;padding:22px}.card{background:#121b27;border:1px solid #2a3b4f;border-radius:16px;padding:18px;margin:12px 0}input,textarea{width:100%;background:#080d13;border:1px solid #3c5068;color:#fff;padding:12px;border-radius:9px;margin:5px 0 12px;font:inherit}button{background:#ff7a1a;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;margin:3px;color:#111}button.alt{background:#2a3b4f;color:#fff}button.danger{background:#d84b4b;color:white}.muted,small{color:#a9b8c9}.hidden{display:none}.player{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #2a3b4f}#msg{min-height:24px;color:#ffbf81}
</style></head><body><main><h1>🔐 Otoyol Sürücüsü Yönetim Paneli</h1><p class="muted">Yönetici hesabı sunucu ortam değişkenlerinden doğrulanır; parola bu sayfada saklanmaz.</p>
<div id="login" class="card"><h2>Giriş</h2><form id="loginForm"><label>Kullanıcı adı</label><input name="username" autocomplete="username" required maxlength="100"><label>Parola</label><input name="password" type="password" autocomplete="current-password" required><button>Giriş yap</button></form></div>
<div id="panel" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h2>Çevrimiçi oyuncular</h2><div><button id="refresh" class="alt">Yenile</button><button id="logout" class="alt">Çıkış</button></div></div><div id="players"></div></div>
<div class="card"><h2>Duyuru</h2><textarea id="announcement" rows="3" maxlength="240" placeholder="Oyunculara duyuru"></textarea><button id="send">Duyuruyu gönder</button><button id="clear" class="alt">Temizle</button></div>
<div class="card"><h2>Takma adı engelle</h2><input id="banNick" maxlength="18" placeholder="Takma ad"><button id="ban" class="danger">Engelle ve bağlantıyı kes</button></div></div><div id="msg" role="status"></div></main>
<script>
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw Error(j.error||'İstek başarısız');return j}
async function load(){try{const s=await api('/api/admin/state');$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('announcement').value=s.announcement||'';$('players').innerHTML=s.players.length?s.players.map(p=>`<div class="player"><div><strong>${esc(p.nickname)}</strong><br><small>${esc(p.id)}</small></div><button class="danger" data-kick="${esc(p.id)}">Bağlantıyı kes</button></div>`).join(''):'<p class="muted">Çevrimiçi oyuncu yok.</p>';$('players').querySelectorAll('[data-kick]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/kick',{id:b.dataset.kick});msg('Bağlantı kesildi.');load()}catch(e){msg(e.message)}})}catch(e){$('panel').classList.add('hidden');$('login').classList.remove('hidden')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/login',{username:f.get('username'),password:f.get('password')});e.target.reset();msg('Giriş başarılı.');load()}catch(err){msg(err.message)}};
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{});$('panel').classList.add('hidden');$('login').classList.remove('hidden');msg('Çıkış yapıldı.')}catch(e){msg(e.message)}};
$('refresh').onclick=load;$('send').onclick=async()=>{try{await api('/api/admin/announcement',{message:$('announcement').value});msg('Duyuru gönderildi.')}catch(e){msg(e.message)}};
$('clear').onclick=async()=>{ $('announcement').value='';try{await api('/api/admin/announcement',{message:''});msg('Duyuru temizlendi.')}catch(e){msg(e.message)}};
$('ban').onclick=async()=>{try{await api('/api/admin/ban',{nickname:$('banNick').value});msg('Takma ad engellendi.');$('banNick').value='';load()}catch(e){msg(e.message)}};load();
</script></body></html>
